name: Update Copyright Year

on:
  schedule:
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-year:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Years
        id: years
        run: |
          CURRENT_YEAR=$(date +'%Y')
          PREVIOUS_YEAR=$((CURRENT_YEAR - 1))

          echo "current=$CURRENT_YEAR" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS_YEAR" >> $GITHUB_OUTPUT

      - name: Update HTML File
        run: |
          PREV="${{ steps.years.outputs.previous }}"
          CURR="${{ steps.years.outputs.current }}"

          find . -name "*.html" -type f -exec sed -i "s/© $PREV/© $CURR/g" {} +

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update copyright year to ${{ steps.years.outputs.current }}"
